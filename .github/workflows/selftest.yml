name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13"]
    steps:
      # Actions pinned to full commit SHAs (tags can be moved); update deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Deterministic self-test (no model)
        run: python3 -I evals/selftest.py
      - name: Demo
        run: python3 -I demo/run_demo.py "$RUNNER_TEMP/demo"

  skills:
    # Every skill must pass the Agent Skills reference validator, so it loads in any agent that supports the standard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate every skill (skills-ref 0.1.5)
        run: |
          for d in skills/*/; do npx -y skills-ref@0.1.5 validate "$d"; done
