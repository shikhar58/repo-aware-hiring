name: Bug report
description: Something didn't work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please **don't paste candidate data, CV text, internal code or anything from your codebase map**.
        For security issues, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From .claude-plugin/plugin.json or /plugin in Claude Code
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which skill or script?
      placeholder: e.g. write-job-description, check_map.py
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Remove anything from your codebase or candidates first.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, agent
